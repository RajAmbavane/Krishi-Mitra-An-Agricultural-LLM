name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci_dummy_key
      VITE_BACKEND_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax smoke test
        run: |
          python - <<'PY'
          import pathlib
          files = [
              "main.py",
              "prompt_builder.py",
              "search_engine.py",
              "weather_service.py",
              "llama_runner.py",
          ]
          for f in files:
              src = pathlib.Path(f).read_text(encoding="utf-8")
              compile(src, f, "exec")
          print("backend syntax ok")
          PY
